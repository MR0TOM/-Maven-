server:
  port: 8080

spring:
  # 生产环境数据源
  datasource:
    url: jdbc:mysql://prod-mysql:3306/smart_park_energy?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 生产环境 Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # 生产环境 Kafka
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

# 日志级别
logging:
  level:
    com.smartpark: warn
    org.springframework.web: error
  file:
    name: /var/log/smart-park/app.log
