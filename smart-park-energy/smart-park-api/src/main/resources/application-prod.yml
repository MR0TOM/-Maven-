server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql-server:3306/smart_park_energy?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50

  data:
    redis:
      host: redis-server
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0

  kafka:
    bootstrap-servers: kafka-server:9092

logging:
  level:
    root: warn
    com.smartpark: info

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
